name: Cruise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  LIGHTHOUSE_REPORT_URL: https://jayg67.github.io/cruise/lighthouse/
  COVERAGE_REPORT_URL: https://jayg67.github.io/cruise/coverage/
  QUALITY_DASHBOARD_URL: https://jayg67.github.io/cruise/
  LIVE_APP_URL: https://cruise-explorer.onrender.com/

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run unitTests

  coverage-report:
    name: Jest Coverage Report
    runs-on: ubuntu-latest
    needs:
      - unit-tests

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      NODE_ENV: test
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run Jest coverage
        run: npm run coverage:ci

      - name: Prepare coverage report for GitHub Pages
        run: npm run coverage:prepare-pages

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: |
            coverage
            github-pages/coverage
          if-no-files-found: error


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run integration tests
        run: npm run integrationTests

  ui-tests:
    name: Cypress UI Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: React Production Completion Audit
        run: npm run react:production:complete

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run React production Cypress tests
        run: npm run uiTests:ci

  playwright-mobile-tests:
    name: Playwright Mobile Tests
    runs-on: ubuntu-latest
    needs:
      - integration-tests

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run React production mobile tests
        run: npm run playwright:mobile:ci

      - name: Upload Playwright mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore


  performance-smoke:
    name: k6 Performance Smoke Test
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - ui-tests
      - playwright-mobile-tests

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000
      BASE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run k6 performance smoke test
        run: npm run perf:smoke:ci


  lighthouse-mobile-audit:
    name: Mobile Quality & UX Gate
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - ui-tests
      - coverage-report
      - playwright-mobile-tests

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Download coverage report for GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage-artifact

      - name: Restore coverage report into GitHub Pages staging
        run: |
          mkdir -p github-pages
          cp -R coverage-artifact/github-pages/coverage github-pages/coverage

      - name: Run Lighthouse mobile audit and quality gate
        run: npm run lighthouse:ci:ci

      - name: Verify Lighthouse mobile report artifact
        if: always()
        run: npm run lighthouse:assert-report

      - name: Prepare Lighthouse report for GitHub Pages
        if: always()
        run: npm run lighthouse:prepare-pages

      - name: Prepare Quality Dashboard for GitHub Pages
        if: always()
        run: npm run quality:prepare-dashboard

      - name: Add mobile quality report links to job summary
        if: always()
        run: |
          echo "## Mobile Quality & UX Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Quality Dashboard]($QUALITY_DASHBOARD_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open latest Lighthouse report]($LIGHTHOUSE_REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open latest Jest coverage report]($COVERAGE_REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "These links update after the GitHub Pages deployment completes." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: |
            lhci-report
            github-pages/lighthouse
            github-pages/coverage
            .lighthouseci
            lighthouse-report.report.html
            lighthouse-report.report.json
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

  deploy-lighthouse-report:
    name: Publish Quality Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - lighthouse-mobile-audit
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}lighthouse/

    steps:
      - name: Deploy latest Lighthouse report
        id: deployment
        uses: actions/deploy-pages@v4

