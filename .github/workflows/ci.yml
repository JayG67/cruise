name: Cruise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run unitTests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run integration tests
        run: npm run integrationTests

  ui-tests:
    name: Cypress UI Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run Cypress tests
        run: npm run uiTests:ci

  performance-smoke:
    name: k6 Performance Smoke Test
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - ui-tests

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000
      BASE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run k6 performance smoke test
        run: npm run perf:smoke:ci

  lighthouse-mobile-audit:
    name: Lighthouse Mobile Quality Gate
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - ui-tests

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run Lighthouse mobile quality gate
        run: npm run lighthouse:ci:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: |
            lhci-report
            .lighthouseci
            lighthouse-report.report.html
            lighthouse-report.report.json
          if-no-files-found: ignore
