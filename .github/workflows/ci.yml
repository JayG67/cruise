name: Cruise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  LIGHTHOUSE_REPORT_URL: https://jayg67.github.io/cruise/lighthouse/
  COVERAGE_REPORT_URL: https://jayg67.github.io/cruise/coverage/
  QUALITY_DASHBOARD_URL: https://jayg67.github.io/cruise/
  LIVE_APP_URL: https://cruise-explorer.onrender.com/

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify clean release revision
        run: npm run release:integrity

      - name: Verify source quality baseline
        run: npm run quality:source

      - name: Verify release source contract
        run: npm run release:source:audit

      - name: Verify production deployment contract
        run: npm run production:deployment:audit

      - name: Verify production dependencies
        run: npm run production:dependencies:audit

      - name: Verify security closeout contracts
        run: node scripts/verify-security-closeout.js

      - name: Verify final security release matrix
        run: node scripts/verify-security-release-matrix.js

      - name: Run unit tests
        run: npm run unitTests

      - name: Upload security release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-quality-evidence
          path: security-quality-evidence/release-matrix.json
          if-no-files-found: error
          retention-days: 30

  ai-quality-gate:
    name: AI Quality Gate
    runs-on: ubuntu-latest
    needs:
      - unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find previous AI quality evidence run
        id: previous-ai-run
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head?.ref
              || context.ref.replace('refs/heads/', '')
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch,
              status: 'completed',
              per_page: 20
            })

            let baselineRunId = ''
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              })
              const evidence = artifacts.data.artifacts.find(artifact => (
                artifact.name === 'ai-quality-evidence' && !artifact.expired
              ))
              if (evidence) {
                baselineRunId = String(run.id)
                break
              }
            }

            core.setOutput('run-id', baselineRunId)
            core.notice(baselineRunId
              ? `Using AI quality evidence from workflow run ${baselineRunId}.`
              : 'No prior AI quality evidence artifact is available; comparison will use FIRST_RUN.')

      - name: Download previous AI quality evidence
        if: steps.previous-ai-run.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ai-quality-evidence
          path: ai-quality-evidence/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.previous-ai-run.outputs.run-id }}

      - name: Run AI CI quality gate
        id: ai-quality-gate
        continue-on-error: true
        run: npm run ai:ci:gate

      - name: Compare AI quality evidence with prior run
        if: always()
        run: npm run ai:ci:evidence:compare

      - name: Enforce AI release evidence policy
        if: always()
        run: npm run ai:ci:evidence:verify

      - name: Add AI quality gate result to job summary
        if: always()
        run: |
          echo "## AI Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ai-quality-evidence/phase6-ci-evidence.json ]; then
            node -e "const e=require('./ai-quality-evidence/phase6-ci-evidence.json'); const c=require('./ai-quality-evidence/phase6-ci-comparison.json'); console.log('Release decision: **'+e.releaseDecision+'**\n\nChecks passed: **'+e.passedChecks+'/'+e.totalChecks+'**\n\nHistorical comparison: **'+c.outcome+'**\n\nNew failures: **'+c.newFailures.length+'** | Resolved failures: **'+c.resolvedFailures.length+'**')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evidence artifact was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AI quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-evidence
          path: |
            ai-quality-evidence/phase6-ci-evidence.json
            ai-quality-evidence/phase6-ci-comparison.json
          if-no-files-found: error
          retention-days: 30


  coverage-report:
    name: Jest Coverage Report
    runs-on: ubuntu-latest
    needs:
      - unit-tests

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      NODE_ENV: test
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run Jest coverage
        id: jest-coverage
        continue-on-error: true
        run: npm run coverage:ci

      - name: Build complete coverage evidence manifest
        if: always()
        run: node scripts/build-coverage-evidence.js

      - name: Verify complete raw coverage artifact set
        if: always()
        run: node scripts/verify-coverage-artifacts.js

      - name: Prepare coverage report for GitHub Pages
        if: always()
        run: npm run coverage:prepare-pages

      - name: Verify complete published coverage artifact set
        if: always()
        run: node scripts/verify-coverage-artifacts.js --published

      - name: Add coverage result to job summary
        if: always()
        run: |
          echo "## Jest Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node -e "const c=require('./coverage/coverage-summary.json').total; for (const key of ['statements','branches','functions','lines']) console.log(key[0].toUpperCase()+key.slice(1)+': **'+c[key].pct+'%** ('+c[key].covered+'/'+c[key].total+')')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact includes HTML, LCOV, JSON, JSON summary, Cobertura XML, Clover XML, and complete per-file JSON/Markdown/CSV coverage evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: |
            coverage
            github-pages/coverage
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Jest coverage gate result
        if: always()
        run: |
          if [ "${{ steps.jest-coverage.outcome }}" != "success" ]; then
            echo "Jest tests or coverage thresholds failed. See the uploaded jest-coverage-report artifact for complete coverage evidence."
            exit 1
          fi


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@postgres:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@postgres:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run integration tests
        run: npm run integrationTests

  ui-tests:
    name: Cypress UI Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: React Production Completion Audit
        run: npm run react:production:complete

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run React production Cypress tests
        run: npm run uiTests:react:ci

  playwright-mobile-tests:
    name: Playwright Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - integration-tests
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@postgres:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@postgres:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run React production mobile tests
        run: npm run playwright:mobile:ci

      - name: Upload Playwright mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore


  performance-smoke:
    name: k6 Performance Smoke Test
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - ui-tests
      - playwright-mobile-tests

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000
      BASE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Run k6 performance smoke test
        run: npm run perf:smoke:ci


  lighthouse-mobile-audit:
    name: Mobile Quality & UX Gate
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - ai-quality-gate
      - integration-tests
      - ui-tests
      - coverage-report
      - playwright-mobile-tests
      - performance-smoke

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cruise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/cruise
      PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database connection
        run: npm run db:verify:test

      - name: Download coverage report for GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage-artifact

      - name: Restore coverage report into GitHub Pages staging
        run: |
          mkdir -p github-pages
          cp -R coverage-artifact/github-pages/coverage github-pages/coverage

      - name: Download AI quality evidence for GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: ai-quality-evidence
          path: ai-quality-evidence

      - name: Download security release evidence for GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: security-quality-evidence
          path: security-quality-evidence

      - name: Stage AI and security evidence for GitHub Pages
        run: |
          mkdir -p github-pages/evidence
          cp ai-quality-evidence/phase6-ci-evidence.json github-pages/evidence/ai-quality-evidence.json
          cp ai-quality-evidence/phase6-ci-comparison.json github-pages/evidence/ai-quality-comparison.json
          cp security-quality-evidence/release-matrix.json github-pages/evidence/security-release-matrix.json

      - name: Run Lighthouse mobile audit and quality gate
        run: npm run lighthouse:ci:ci

      - name: Verify Lighthouse mobile report artifact
        if: always()
        run: npm run lighthouse:assert-report

      - name: Prepare Lighthouse report for GitHub Pages
        if: always()
        run: npm run lighthouse:prepare-pages

      - name: Prepare Quality Dashboard for GitHub Pages
        if: always()
        run: npm run quality:prepare-dashboard

      - name: Add mobile quality report links to job summary
        if: always()
        run: |
          echo "## Mobile Quality & UX Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Quality Dashboard]($QUALITY_DASHBOARD_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open latest Lighthouse report]($LIGHTHOUSE_REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open latest Jest coverage report]($COVERAGE_REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "These links update after the GitHub Pages deployment completes." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: |
            lhci-report
            github-pages/lighthouse
            github-pages/coverage
            github-pages/evidence
            .lighthouseci
            lighthouse-report.report.html
            lighthouse-report.report.json
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

  deploy-lighthouse-report:
    name: Publish Quality Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - lighthouse-mobile-audit
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}lighthouse/

    steps:
      - name: Deploy latest Lighthouse report
        id: deployment
        uses: actions/deploy-pages@v4

