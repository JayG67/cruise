services:
  - type: web
    name: cruise-explorer
    runtime: node
    plan: starter
    numInstances: 1
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run react:build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRUISE_AUTH_MODE
        value: jwt
      - key: CRUISE_DEMO_DATA_MODE
        value: disabled
      - key: CRUISE_RATE_LIMIT_MODE
        value: enabled
      - key: CRUISE_API_RATE_LIMIT
        value: 600
      - key: CRUISE_MUTATION_RATE_LIMIT
        value: 180
      - key: CRUISE_AI_RATE_LIMIT
        value: 30
      - key: CRUISE_JWT_SECRET
        sync: false
      - key: CRUISE_JWT_ISSUER
        sync: false
      - key: CRUISE_JWT_AUDIENCE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cruise-db
          property: connectionString

databases:
  - name: cruise-db
    plan: starter
    numInstances: 1
    region: virginia