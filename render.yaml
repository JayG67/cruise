services:
  - type: web
    name: cruise-explorer
    runtime: node
    plan: starter
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run react:build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRUISE_AUTH_MODE
        value: jwt
      - key: CRUISE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cruise-db
          property: connectionString

databases:
  - name: cruise-db
    plan: starter
    region: virginia