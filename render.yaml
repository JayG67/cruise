services:
  - type: web
    name: cruise-explorer
    runtime: node
    plan: starter
    numInstances: 1
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run react:build
    preDeployCommand: npm run db:bootstrap:render-demo
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRUISE_AUTH_MODE
        value: jwt
      - key: CRUISE_DEMO_DATA_MODE
        value: disabled
      - key: CRUISE_PUBLIC_DEMO_READ_MODE
        value: enabled
      - key: CRUISE_RATE_LIMIT_MODE
        value: enabled
      - key: CRUISE_API_RATE_LIMIT
        value: 600
      - key: CRUISE_MUTATION_RATE_LIMIT
        value: 180
      - key: CRUISE_AI_RATE_LIMIT
        value: 30
      # Render generates this once when the variable does not already exist.
      # This keeps production fail-closed JWT validation deployable without committing a secret.
      - key: CRUISE_JWT_SECRET
        generateValue: true
      - key: CRUISE_JWT_ISSUER
        value: cruise-explorer-render
      - key: CRUISE_JWT_AUDIENCE
        value: cruise-explorer-api
      - key: DATABASE_URL
        fromDatabase:
          name: cruise-db
          property: connectionString

databases:
  - name: cruise-db
    plan: starter
    numInstances: 1
    region: virginia